<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ines Beauty Institut | Gestion & Réservations</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --sage: #7B8470; --sage-light: #A5AD9A; --cream: #F8F5F0; --gold: #D4AF37; --dark: #2C2C2C; --white: #FFFFFF; --red: #D32F2F; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--cream); color: var(--dark); line-height: 1.6; }
        html { scroll-behavior: smooth; }

        nav { padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(248, 245, 240, 0.9); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(123, 132, 112, 0.1); }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--sage); letter-spacing: 2px; }
        .nav-links a { text-decoration: none; color: var(--dark); margin-left: 2rem; font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        header { height: 100vh; background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('assets/images/hero.png') center/cover no-repeat; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .hero-content { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 4rem 2rem; border: 1px solid rgba(255,255,255,0.2); animation: fadeIn 1.5s ease-out; max-width: 700px; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 4.5rem); margin-bottom: 1rem; color: var(--white); font-style: italic; }
        .btn { padding: 1.2rem 2.5rem; background: var(--sage); color: white; border: none; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.4s; }
        .btn:hover { background: var(--dark); transform: translateY(-3px); }

        section { padding: 8rem 5%; }
        h2 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 4rem; text-align: center; color: var(--sage); }

        /* Slots Grid */
        .slots-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .slot { padding: 10px; border: 1px solid var(--sage); text-align: center; cursor: pointer; font-weight: 700; font-size: 0.9rem; border-radius: 4px; transition: 0.3s; }
        .slot:hover { background: var(--sage); color: white; }
        .slot.selected { background: var(--sage); color: white; }
        .slot.booked { background: #eee; border-color: #ddd; color: #bbb; cursor: not-allowed; }

        /* Planning List */
        .planning-page { display: none; padding: 2rem; background: white; border-radius: 8px; margin-top: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .reservation-card { padding: 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .res-time { background: var(--sage); color: white; padding: 5px 10px; border-radius: 4px; font-weight: 700; min-width: 80px; text-align: center; }
        .res-info b { display: block; font-size: 1.1rem; }
        .res-info small { color: #888; }

        /* Modal */
        #modal, #admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 1rem; }
        .modal-card { background: var(--cream); width: 100%; max-width: 500px; padding: 3rem; border-radius: 4px; position: relative; border-top: 8px solid var(--sage); max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer; color: var(--sage); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--sage); }
        input, select { width: 100%; padding: 1rem; border: 1px solid #ddd; background: #fff; font-size: 1rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">INES BEAUTY</div>
        <div class="nav-links">
            <a href="#services">Tarifs</a>
            <a href="#" onclick="openAdmin()">Planning</a>
            <a href="#" onclick="openModal()" style="background: var(--sage); color: white; padding: 10px 20px; border-radius: 4px;">Réserver</a>
        </div>
    </nav>

    <header>
        <div class="hero-content">
            <p class="subtitle">Institut de Beauté</p>
            <h1>Prendre Rendez-vous</h1>
            <p>Choisissez votre créneau horaire pour une séance de bien-être exclusive.</p>
            <button class="btn" style="margin-top: 2rem;" onclick="openModal()">Réserver Maintenant</button>
        </div>
    </header>

    <section id="planning-section" style="display: none;">
        <h2>Planning des Réservations</h2>
        <div id="reservation-list" class="planning-page" style="display: block;">
            <!-- Les réservations s'afficheront ici -->
        </div>
    </section>

    <!-- MODAL RESERVATION -->
    <div id="modal">
        <div class="modal-card">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 style="font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 1rem;">Votre Séance</h3>
            <form id="booking-form">
                <div class="form-group">
                    <label>Nom Complet</label>
                    <input type="text" id="cust-name" required>
                </div>
                <div class="form-group">
                    <label>Prestation</label>
                    <select id="cust-type" required>
                        <option value="Nails">Nails (Chablons/Capsules)</option>
                        <option value="Soin Mains/Pieds">Soin Mains / Pieds</option>
                        <option value="Soins Visage">Soins du Visage</option>
                        <option value="Massage">Massage Relaxant</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date du Rendez-vous</label>
                    <input type="date" id="cust-date" onchange="checkAvailability()" required>
                </div>
                <div class="form-group">
                    <label>Choisir un Créneau (1h)</label>
                    <div id="slots-grid" class="slots-container">
                        <!-- Slots generated by JS -->
                    </div>
                    <input type="hidden" id="cust-time" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" id="cust-phone" placeholder="05XX XX XX XX" required>
                </div>
                <button type="submit" id="submit-btn" class="btn" style="width: 100%;">Confirmer le RDV</button>
            </form>
        </div>
    </div>

    <!-- MODAL ADMIN -->
    <div id="admin-modal">
        <div class="modal-card" style="max-width: 400px; text-align: center;">
            <span class="close-modal" onclick="closeAdmin()">&times;</span>
            <h3>Accès Planning</h3>
            <p style="margin-bottom: 1.5rem; font-size: 0.9rem;">Entrez le code secret pour voir les RDV</p>
            <input type="password" id="admin-pin" placeholder="••••" maxlength="4" style="text-align: center; font-size: 2rem; letter-spacing: 10px; margin-bottom: 1rem;">
            <button class="btn" style="width: 100%;" onclick="verifyPin()">Accéder</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBgK8ZKmZ0N329vOTfpiAyYAhPu_mhyTAM",
            authDomain: "app-10-1b5fd.firebaseapp.com",
            projectId: "app-10-1b5fd",
            storageBucket: "app-10-1b5fd.appspot.com",
            messagingSenderId: "179443689337",
            appId: "1:179443689337:web:31ca73ac50811b286931a8"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        let bookedSlots = [];

        async function checkAvailability() {
            const date = document.getElementById('cust-date').value;
            if(!date) return;

            const grid = document.getElementById('slots-grid');
            grid.innerHTML = "<p style='grid-column: span 4; font-size: 0.8rem;'>Chargement des créneaux...</p>";

            // Fetch bookings for this date
            const snap = await db.collection("ines_beauty_bookings").where("date", "==", date).get();
            bookedSlots = snap.docs.map(doc => doc.data().time);

            renderSlots();
        }

        function renderSlots() {
            const grid = document.getElementById('slots-grid');
            grid.innerHTML = "";
            const hours = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];

            hours.forEach(h => {
                const isBooked = bookedSlots.includes(h);
                const slot = document.createElement('div');
                slot.className = "slot" + (isBooked ? " booked" : "");
                slot.innerText = h;
                
                if(!isBooked) {
                    slot.onclick = () => {
                        document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                        slot.classList.add('selected');
                        document.getElementById('cust-time').value = h;
                    };
                }
                grid.appendChild(slot);
            });
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('cust-date').value = new Date().toISOString().split('T')[0];
            checkAvailability();
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        function verifyPin() {
            if(document.getElementById('admin-pin').value === "2020") {
                closeAdmin();
                document.getElementById('planning-section').style.display = 'block';
                loadPlanning();
                window.scrollTo(0, document.getElementById('planning-section').offsetTop - 100);
            } else {
                alert("CODE FAUX");
            }
        }

        function loadPlanning() {
            db.collection("ines_beauty_bookings").orderBy("date", "asc").orderBy("time", "asc").onSnapshot(snap => {
                const list = document.getElementById('reservation-list');
                list.innerHTML = "";
                if(snap.empty) list.innerHTML = "<p style='text-align:center; padding:2rem;'>Aucun rendez-vous pour le moment.</p>";
                
                snap.forEach(doc => {
                    const r = doc.data();
                    list.innerHTML += `
                        <div class="reservation-card">
                            <div class="res-info">
                                <b>${r.fullname}</b>
                                <small>${r.service} - 📞 ${r.phone}</small><br>
                                <small>Date: ${r.date}</small>
                            </div>
                            <div class="res-time">${r.time}</div>
                        </div>
                    `;
                });
            });
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const time = document.getElementById('cust-time').value;
            if(!time) return alert("Veuillez choisir une heure !");

            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "PATIENTEZ...";

            const data = {
                fullname: document.getElementById('cust-name').value,
                service: document.getElementById('cust-type').value,
                date: document.getElementById('cust-date').value,
                time: time,
                phone: document.getElementById('cust-phone').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("ines_beauty_bookings").add(data);
                alert("RDV CONFIRMÉ ! À très vite chez Ines Beauty.");
                closeModal(); e.target.reset();
            } catch(e) { alert("ERREUR"); }
            btn.disabled = false; btn.innerText = "CONFIRMER LE RDV";
        });
    </script>
</body>
</html>
